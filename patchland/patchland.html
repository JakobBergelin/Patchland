<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patchland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dce4e0; --bg2:#eef2ef; --ink:#1e2c29; --soft:#56645f; --panel:#f6f8f6;
  --line:rgba(30,44,41,.14); --chips:#2d6c9a; --mult:#a3312b; --slot:rgba(30,44,41,.38); --gold:#c99412;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#18211f; --bg2:#23312d; --ink:#e4ebe8; --soft:#9aa9a4; --panel:#212c29;
    --line:rgba(228,235,232,.13); --chips:#4f93c6; --mult:#c9473f; --slot:rgba(228,235,232,.38); --gold:#e9b938;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#18211f; --bg2:#23312d; --ink:#e4ebe8; --soft:#9aa9a4; --panel:#212c29;
  --line:rgba(228,235,232,.13); --chips:#4f93c6; --mult:#c9473f; --slot:rgba(228,235,232,.38); --gold:#e9b938;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--chips);outline-offset:2px}

#app{height:100%;display:flex;flex-direction:column;max-width:960px;margin:0 auto}

.hud{display:flex;align-items:center;gap:12px;padding:12px 16px 6px}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat small{font-size:12.5px;color:var(--soft)}
.stat b{font-size:21px;font-weight:750;font-variant-numeric:tabular-nums;display:inline-block}
.stat .of{font-size:14px;color:var(--soft);font-weight:500}
.stat.low b{color:var(--mult);animation:pulse .9s ease-in-out infinite}
.goal{flex:1;min-width:0}
.goal .row{display:flex;justify-content:space-between;align-items:baseline;font-variant-numeric:tabular-nums}
.goal .row b{font-size:21px;font-weight:750;display:inline-block;transform-origin:left center}
.goal .row span{font-size:13.5px;color:var(--soft)}
.bar{position:relative;height:8px;border-radius:99px;background:var(--line);margin-top:5px;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0;width:0;transition:width .25s ease,left .25s ease}
#barFill{background:var(--chips);border-radius:99px;z-index:1}
#barProj{background:var(--chips);opacity:.32}
.bar.pace #barProj{background:var(--gold);opacity:.6}
.bar.done #barFill{background:var(--mult)}
.projline{display:block;font-size:12.5px;color:var(--soft);margin-top:4px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:36px;height:36px;flex:none;border-radius:50%;border:1px solid var(--line);background:var(--panel);font-weight:700;display:grid;place-items:center;padding:0}
.icon svg{width:18px;height:18px}

.relics{display:flex;gap:6px;overflow-x:auto;padding:0 16px 8px;min-height:36px;align-items:center;scrollbar-width:none}
.relics::-webkit-scrollbar{display:none}
.relic{flex:none;display:inline-flex;align-items:center;gap:7px;height:28px;padding:0 11px 0 9px;border-radius:99px;border:1px solid var(--line);background:var(--panel);font-weight:600;font-size:13px}
.relic i{width:11px;height:12px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.relic em{font-style:normal;color:var(--mult)}
.relic.boss{background:var(--mult);border-color:transparent;color:#fff}
.relic.boss i{background:#fff}
.empty{font-size:13px;color:var(--soft)}

.stage{flex:1;min-height:0;position:relative;background:radial-gradient(120% 90% at 50% 45%,var(--bg2),var(--bg));overflow:hidden}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#toast{position:absolute;left:50%;top:10px;transform:translate(-50%,-6px);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:86%;text-align:center;z-index:2}
#toast.show{opacity:1;transform:translate(-50%,0)}
#banner{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;width:92%;z-index:1}
#banner b{display:block;font-size:clamp(30px,8vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.05;color:var(--ink);text-shadow:0 2px 0 var(--bg),0 0 22px var(--bg)}
#banner span{display:block;font-size:16px;font-weight:600;color:var(--soft);margin-top:6px;text-shadow:0 0 12px var(--bg),0 0 4px var(--bg)}
#banner.boss b{color:var(--mult)}
#banner.show{animation:banner 2s ease forwards}

.tray{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"hand readout" "actions actions";gap:10px 14px;padding:12px 16px 14px;border-top:1px solid var(--line);background:var(--panel)}
@media (min-width:720px){.tray{grid-template-columns:auto 1fr auto;grid-template-areas:"hand readout actions";align-items:center;border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:0}}
.hand{grid-area:hand;display:flex;align-items:flex-end;gap:10px}
.cur{width:86px;height:86px;border-radius:16px;border:1px solid var(--line);background:var(--bg2);padding:0;display:block}
.cur canvas,.next canvas{width:100%;height:100%;display:block}
.next{width:46px;display:flex;flex-direction:column;align-items:center;gap:2px}
.next canvas{height:46px;opacity:.85}
.next small{font-size:12px;color:var(--soft)}
.readout{grid-area:readout;min-width:0;align-self:center}
.calc{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.calc .chips,.calc .mult{min-width:44px;text-align:center;padding:4px 10px;border-radius:10px;color:#fff;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;transition:opacity .15s;display:inline-block}
.calc .chips{background:var(--chips)}
.calc .mult{background:var(--mult)}
.calc .x,.calc .eq{color:var(--soft);font-size:18px}
.calc b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;display:inline-block}
.calc.idle .chips,.calc.idle .mult,.calc.idle b{opacity:.32}
.streak{font-size:13px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--gold);color:#241a00;margin-left:2px}
.hint{font-size:13.5px;line-height:1.35;color:var(--soft);margin:6px 0 0;min-height:2.7em}
.actions{grid-area:actions;display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:8px}
@media (min-width:720px){.actions{width:340px}}
.btn{height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);font-weight:650;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--mult);border-color:transparent;color:#fff}
.btn:not(:disabled):active{transform:scale(.96)}
.badge{font-size:12.5px;font-weight:700;min-width:20px;height:20px;border-radius:99px;background:var(--line);display:inline-grid;place-items:center;padding:0 5px}

#overlay{position:fixed;inset:0;background:rgba(16,24,22,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:grid;place-items:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);z-index:20}
.sheet{background:var(--panel);border-radius:20px;width:100%;max-width:430px;padding:22px 22px 20px;max-height:100%;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:sheetIn .28s cubic-bezier(.2,.9,.3,1.2)}
.sheet h1{font-size:46px;font-weight:800;letter-spacing:-.035em;line-height:1;margin:0}
.sheet h2{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:0 0 8px}
.sheet p{font-size:15.5px;line-height:1.5;margin:0 0 10px;max-width:62ch}
.sheet .muted{color:var(--soft);font-size:14px}
.hero{width:100%;height:150px;display:block;margin:6px 0 10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:0 0 12px;font-size:13.5px;color:var(--soft)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:13px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.legend b{color:var(--ink);font-variant-numeric:tabular-nums}
.go{width:100%;height:50px;margin-top:8px;font-size:17px}
.cards{display:grid;gap:8px;margin-top:12px}
.card{display:grid;grid-template-columns:54px 1fr;gap:12px;align-items:center;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);animation:cardIn .35s cubic-bezier(.2,.9,.3,1.25) both}
.card:nth-child(2){animation-delay:.07s}
.card:nth-child(3){animation-delay:.14s}
.card:hover{border-color:var(--soft)}
.card canvas{width:54px;height:54px;display:block}
.card b{display:block;font-size:16.5px;font-weight:750}
.card small{display:block;font-size:13.5px;color:var(--soft);line-height:1.35;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:4px 0 12px}
.stats div{background:var(--bg2);border-radius:12px;padding:8px 10px}
.stats b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.stats small{font-size:12.5px;color:var(--soft)}

.pop{animation:pop .24s cubic-bezier(.2,.9,.3,1.3)}
.spin{animation:spin .2s ease-out}
.swap{animation:swap .25s ease-out}
@keyframes pop{0%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes spin{0%{transform:rotate(-35deg) scale(.9)}100%{transform:none}}
@keyframes swap{0%{transform:translateX(26px);opacity:0}100%{transform:none;opacity:1}}
@keyframes pulse{50%{transform:scale(1.18)}}
@keyframes banner{0%{opacity:0;transform:translate(-50%,-38%) scale(.9)}12%{opacity:1;transform:translate(-50%,-50%) scale(1)}78%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-62%)}}
@keyframes bannerFade{0%,100%{opacity:0}15%,80%{opacity:1}}
@keyframes sheetIn{0%{transform:translateY(16px) scale(.97);opacity:0}100%{transform:none;opacity:1}}
@keyframes cardIn{0%{transform:translateY(12px) scale(.95);opacity:0}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){
  .bar i,#toast,.calc .chips,.calc .mult{transition:none}
  .pop,.spin,.swap,.stat.low b,.sheet,.card{animation:none}
  #banner.show{animation:bannerFade 2s ease forwards}
}
</style>
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="stat"><small>Round</small><b><span id="roundN">1</span><span class="of">/8</span></b></div>
    <div class="goal">
      <div class="row"><b id="scoreN">0</b><span>Goal <span id="goalN">0</span></span></div>
      <div class="bar" id="bar"><i id="barFill"></i><i id="barProj"></i></div>
      <small class="projline" id="projLine"></small>
    </div>
    <div class="stat" id="tilesStat"><small>Tiles</small><b id="tilesN">12</b></div>
    <button class="icon" id="muteBtn" aria-label="Sound" aria-pressed="true"></button>
    <button class="icon" id="helpBtn" aria-label="How to play">?</button>
  </header>
  <div class="relics" id="relics"></div>
  <main class="stage" id="stage">
    <canvas id="board" aria-label="Game board"></canvas>
    <div id="banner"><b></b><span></span></div>
    <div id="toast" role="status" aria-live="polite"></div>
  </main>
  <footer class="tray">
    <div class="hand">
      <button class="cur" id="curBtn" aria-label="Current tile, tap to rotate"><canvas id="curCv"></canvas></button>
      <div class="next"><canvas id="nxtCv"></canvas><small>Next</small></div>
    </div>
    <div class="readout">
      <div class="calc idle" id="calc"><span class="chips" id="chipsN">0</span><span class="x">×</span><span class="mult" id="multN">0</span><span class="eq">=</span><b id="projN">0</b><span class="streak" id="streak" hidden></span></div>
      <p class="hint" id="hint"></p>
    </div>
    <div class="actions">
      <button class="btn" id="rotBtn">Rotate</button>
      <button class="btn" id="redrawBtn">Redraw <span class="badge" id="redrawN">2</span></button>
      <button class="btn primary" id="placeBtn" disabled>Place</button>
    </div>
  </footer>
</div>
<div id="overlay" hidden></div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const SQ3 = Math.sqrt(3);
const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]]; // E, NE, NW, W, SW, SE
const TER = {
  forest:{name:'Forest', chips:4, top:'#4f8d58', dark:'#2f6040'},
  field:{name:'Field', chips:5, top:'#e2bb57', dark:'#b38a2c'},
  meadow:{name:'Meadow', chips:3, top:'#a8cd7a', dark:'#76a052'},
  water:{name:'Water', chips:6, top:'#5d9dc7', dark:'#3c78a3'},
  village:{name:'Village', chips:8, top:'#d2c4ab', dark:'#a8977c'}
};
const TKEYS = Object.keys(TER);
const TWEIGHT = [['forest',28],['field',24],['meadow',20],['water',14],['village',14]];
const SPECIALS = {
  windmill:{name:'Windmill', dirs:[0,2,4], len:3, desc:'Fires 3 rays, each 3 tiles long.'},
  lighthouse:{name:'Lighthouse', dirs:[0], len:99, desc:'Fires 1 ray the way it faces, all the way to the edge of your land.'},
  belltower:{name:'Bell tower', dirs:[0,1,2,3,4,5], len:1, desc:'Rings all 6 neighbors.'}
};
const SKEYS = Object.keys(SPECIALS);
const RELICS = [
  {id:'saw', name:'Sawmill', t:'forest', desc:'Forest edges give +4 chips.'},
  {id:'falu', name:'Falu paint', t:'village', desc:'Village edges give +8 chips.'},
  {id:'mill', name:'Watermill', t:'water', desc:'Each matched water edge adds +1 mult.'},
  {id:'harvest', name:'Harvest fair', t:'field', desc:'+3 mult when a field edge matches.'},
  {id:'wild', name:'Open meadow', t:'meadow', desc:'Meadow edges match any land.'},
  {id:'ferry', name:'Ferryman', t:'water', desc:'Water and village edges match each other.'},
  {id:'plumb', name:'Plumb line', t:'village', desc:'Perfect placements give ×3 mult instead of ×2.'},
  {id:'patch', name:'Patchwork', t:'meadow', desc:'+4 mult when you match 3 or more kinds of land at once.'},
  {id:'almanac', name:'Almanac', t:'field', desc:'Gains +1 mult for every perfect placement. Also counts in the harvest.'},
  {id:'mono', name:'Monoculture', t:'forest', desc:'+40 chips for tiles with only one kind of land.'},
  {id:'carto', name:'Cartographer', t:'meadow', desc:'+2 tiles every round.'},
  {id:'second', name:'Second thoughts', t:'water', desc:'+2 redraws every round.'},
  {id:'goldsmith', name:'Goldsmith', t:'village', desc:'Golden tiles show up three times as often.'},
  {id:'surveyor', name:'Surveyor', t:'field', desc:'Quests also give +3 mult to your next placement.'},
  {id:'granary', name:'Granary', t:'field', desc:'Field regions give double chips in the harvest.'},
  {id:'oak', name:'Old oak', t:'forest', desc:'Forest regions of 6+ tiles give +3 mult in the harvest.'},
  {id:'miller', name:'Miller', t:'field', desc:'Windmills fire twice.'},
  {id:'keeper', name:'Lamplighter', t:'water', desc:'Each special tile that fires adds +2 mult instead of +1.'},
  {id:'rope', name:'Bell rope', t:'village', desc:'Bell towers also ring tiles 2 steps away.'},
  {id:'architect', name:'Architect', t:'meadow', desc:'Special tiles show up twice as often.'}
];
const RMAP = Object.fromEntries(RELICS.map(r => [r.id, r]));
const BOSSES = [
  {id:'drought', name:'Drought', desc:'Water gives no chips this round, harvest included.'},
  {id:'blight', name:'Blight', desc:'Forest gives no chips this round, harvest included.'},
  {id:'lean', name:'Lean year', desc:'Villages give no chips this round, harvest included.'},
  {id:'fog', name:'Fog', desc:'You can’t see your next tile, and you get no redraws.'},
  {id:'short', name:'Short season', desc:'You get 3 fewer tiles this round.'}
];
const BMAP = Object.fromEntries(BOSSES.map(b => [b.id, b]));
const BOSS_ROUNDS = [2, 5, 7];
const ROUNDS = 8;
const GOALS = [1500, 5000, 12000, 35000, 75000, 110000, 240000, 420000];
const BEST_KEY = 'patchland-best', MUTE_KEY = 'patchland-muted';
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const fmt = n => Math.round(n).toLocaleString('en-US');
const key = (q, r) => q + ',' + r;
const wpos = (q, r) => [SQ3*(q + r/2), 1.5*r];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function buzz(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }

/* ---------- sound (synthesized, no audio files) ---------- */
let AC = null, master = null, muted = false;
try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) {}
function ac(){
  if (muted) return null;
  if (!AC){
    const C = window.AudioContext || window.webkitAudioContext; if (!C) return null;
    AC = new C(); master = AC.createGain(); master.gain.value = .5; master.connect(AC.destination);
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur, type = 'sine', vol = .2, when = 0, slide = 0){
  const a = ac(); if (!a) return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq*slide), t + dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .03);
}
let noiseBuf = null;
function noiseHit(dur, vol, freq, when = 0){
  const a = ac(); if (!a) return;
  if (!noiseBuf){ noiseBuf = a.createBuffer(1, a.sampleRate*.5, a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
  const t = a.currentTime + when, s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + .02);
}
const PENTA = [0, 2, 4, 7, 9];
const noteHz = n => { n = Math.max(0, Math.min(22, n)); return 330*Math.pow(2, (Math.floor(n/5)*12 + PENTA[n % 5])/12); };
const sfx = {
  drop(){ tone(600, .1, 'sine', .04, 0, .55); },
  land(){ tone(120, .2, 'sine', .32, 0, .45); noiseHit(.09, .16, 700); },
  tick(n){ tone(noteHz(n), .13, 'triangle', .15); },
  soft(n){ tone(noteHz(n), .09, 'triangle', .08); },
  mult(n){ tone(noteHz(n + 4)*.5, .16, 'square', .045); tone(noteHz(n + 4), .12, 'triangle', .08); },
  perfect(st){ const b = 7 + Math.min(st, 8); [0,2,4].forEach((d,i) => tone(noteHz(b + d), .5, 'sine', .13, i*.04)); tone(noteHz(b + 7), .6, 'triangle', .06, .12); },
  gold(){ [0,3,5,8].forEach((d,i) => tone(noteHz(10 + d), .25, 'sine', .09, i*.05)); },
  total(f){ const n = Math.min(12, Math.round(f*40)); tone(noteHz(5 + n), .22, 'triangle', .13); tone(noteHz(5 + n)*.5, .3, 'sine', .11); },
  dud(){ tone(180, .15, 'triangle', .07, 0, .7); },
  quest(){ [0,2,4,7].forEach((d,i) => tone(noteHz(9 + d), .35, 'sine', .12, i*.07)); },
  clear(){ [0,2,4,5,7,9,10].forEach((d,i) => tone(noteHz(5 + d), .3, 'triangle', .11, i*.07)); },
  fail(){ [0,1,2].forEach(i => tone(330/(1 + i*.25), .45, 'sawtooth', .05, i*.18, .85)); },
  rotate(){ tone(1400, .035, 'square', .022); },
  redraw(){ noiseHit(.18, .07, 2400); tone(300, .18, 'sine', .04, 0, 2); },
  select(){ tone(880, .03, 'sine', .03); },
  pick(){ tone(noteHz(10), .12, 'triangle', .1); tone(noteHz(12), .2, 'triangle', .1, .07); },
  boss(){ tone(110, .6, 'sawtooth', .05, 0, .8); tone(165, .6, 'sawtooth', .04, .05, .8); },

  if (a === b) return true;

  if (has('ferry') && ((a === 'water' && b === 'village') || (a === 'village' && b === 'water'))) return true;
  return false;
}
function chipVal(t){
  if ((S.boss === 'drought' && t === 'water') || (S.boss === 'blight' && t === 'forest') || (S.boss === 'lean' && t === 'village')) return 0;
  return TER[t].chips + (t === 'forest' && has('saw') ? 4 : 0) + (t === 'village' && has('falu') ? 8 : 0);
}
function landValue(e){
  let c = 0;
  for (let i = 0; i < 6; i++){
    const n = board.get(key(e.q + DIRS[i][0], e.r + DIRS[i][1])); if (!n) continue;
    const m = edge(e.tile, i);
    if (isMatch(m, edge(n.tile, (i+3) % 6))) c += chipVal(m);
  }
  return c;
}
const specialLen = tile => tile.special === 'belltower' && has('rope') ? 2 : SPECIALS[tile.special].len;
const rayMultPer = () => has('keeper') ? 2 : 1;
function resolveRays(starts){
  const queued = new Set(), queue = [], events = [];
  for (const s of starts){ const k = key(s.q, s.r); if (!queued.has(k)){ queued.add(k); queue.push(s); } }
  while (queue.length){
    const e = queue.shift(), times = e.tile.special === 'windmill' && has('miller') ? 2 : 1;
    for (let rep = 0; rep < times; rep++){
      const ev = {src: e, rays: [], chips: 0, rep};
      for (const d of specialDirs(e.tile)){
        const hits = [];
        for (let st = 1; st <= specialLen(e.tile); st++){
          const n = board.get(key(e.q + DIRS[d][0]*st, e.r + DIRS[d][1]*st));
          if (!n) break;
          const v = landValue(n);
          hits.push({e: n, v}); ev.chips += v;
          if (n.tile.special){ const nk = key(n.q, n.r); if (!queued.has(nk)){ queued.add(nk); queue.push(n); } }
        }
        if (hits.length) ev.rays.push({d, hits});
      }
      events.push(ev);
    }
  }
  return events;
}
function regionSize(start, t){
  const seen = new Set([key(start.q, start.r)]), stack = [start];
  while (stack.length){
    const e = stack.pop();
    for (let i = 0; i < 6; i++){
      if (edge(e.tile, i) !== t) continue;
      const nk = key(e.q + DIRS[i][0], e.r + DIRS[i][1]);
      if (seen.has(nk)) continue;
      const n = board.get(nk);
      if (!n || edge(n.tile, (i+3) % 6) !== t) continue;
      seen.add(nk); stack.push(n);
    }
  }
  return seen.size;
}
function harvestCalc(){
  const regions = [];
  for (const t of TKEYS){
    const seen = new Set();
    for (const e of board.values()){
      const k0 = key(e.q, e.r);
      if (seen.has(k0) || !e.tile.base.includes(t)) continue;
      seen.add(k0);
      const comp = [], stack = [e];
      while (stack.length){
        const x = stack.pop(); comp.push(x);
        for (let i = 0; i < 6; i++){
          if (edge(x.tile, i) !== t) continue;
          const nk = key(x.q + DIRS[i][0], x.r + DIRS[i][1]);
          if (seen.has(nk)) continue;
          const n = board.get(nk);
          if (!n || edge(n.tile, (i+3) % 6) !== t) continue;
          seen.add(nk); stack.push(n);
        }
      }
      if (comp.length >= 2){
        const per = chipVal(t)*(t === 'field' && has('granary') ? 2 : 1);
        const m = Math.floor(comp.length/3) + (t === 'forest' && has('oak') && comp.length >= 6 ? 3 : 0);
        regions.push({t, tiles: comp, n: comp.length, per, chips: per*comp.length, mult: m});
      }
    }
  }
  let chips = 0, mult = 1;
  for (const r of regions){ chips += r.chips; mult += r.mult; }
  if (has('almanac')) mult += S.almanac;
  const events = resolveRays([...board.values()].filter(e => e.tile.special));
  let fired = 0;
  for (const ev of events){ chips += ev.chips; if (ev.rays.length) fired++; }
  mult += fired*rayMultPer();
  return {regions, events, chips, mult, total: chips*mult};
}
function evaluate(q, r, tile){
  let chips = 0, nb = 0, matches = 0, water = 0, field = false;
  const kinds = new Set(), per = [], edgeChips = [];
  for (let i = 0; i < 6; i++){
    const n = board.get(key(q + DIRS[i][0], r + DIRS[i][1]));
    if (!n){ per.push(null); continue; }
    nb++;
    const mine = edge(tile, i), theirs = edge(n.tile, (i+3) % 6), ok = isMatch(mine, theirs);
    per.push(ok);
    if (!ok) continue;
    matches++; kinds.add(mine);
    const c = chipVal(mine);
    edgeChips[i] = c; chips += c;
    if (mine === 'water') water++;
    if (mine === 'field') field = true;
  }
  let events = [], rayChips = 0, rayFired = 0;
  if (tile.special){
    const k = key(q, r), temp = {q, r, tile};
    board.set(k, temp); events = resolveRays([temp]); board.delete(k);
    for (const ev of events){ rayChips += ev.chips; if (ev.rays.length) rayFired++; }
  }
  const perfect = nb >= 2 && matches === nb;
  if (!matches && !rayChips) return {chips:0, mult:0, total:0, nb, matches, per, perfect:false, edgeChips, chipAdd:0, adds:[], muls:[], baseMult:0, events, rayChips:0};
  const adds = [];
  if (has('mill') && water) adds.push(['Watermill', water]);
  if (has('harvest') && field) adds.push(['Harvest fair', 3]);
  if (has('patch') && kinds.size >= 3) adds.push(['Patchwork', 4]);
  if (has('almanac') && S.almanac) adds.push(['Almanac', S.almanac]);
  if (S.surveyBonus) adds.push(['Surveyor', S.surveyBonus]);
  if (perfect && S.streak > 0) adds.push(['Streak', S.streak]);
  if (rayFired) adds.push([rayFired > 1 ? 'Ray chain' : 'Rays', rayFired*rayMultPer()]);
  const chipAdd = has('mono') && new Set(tile.base).size === 1 ? 40 : 0;
  chips += chipAdd + rayChips;
  let mult = 1 + matches;
  for (const a of adds) mult += a[1];
  const muls = [];
  if (perfect) muls.push(['Perfect', has('plumb') ? 3 : 2]);
  if (tile.gold) muls.push(['Golden', 2]);
  for (const m of muls) mult *= m[1];
  return {chips, mult, total: chips*mult, nb, matches, per, perfect, edgeChips, chipAdd, adds, muls, baseMult: 1 + matches, events, rayChips};
}

function newRun(){

       surveyBonus:0, cur:null, nxt:null, busy:false, picks:0, boss:null, harvestBase:0, bossOrder: shuffle(BOSSES.map(b => b.id)).slice(0, BOSS_ROUNDS.length)};
  board.set(key(0,0), {q:0, r:0, tile: makeTile(3, true), born:0, bump:0});

}
function startRound(){

/* ---------- placing ---------- */
function place(){
  if (!sel || !S.cur || S.busy) return;
  const {q, r, k} = sel, tile = S.cur, ev = evaluate(q, r, tile), [wx, wy] = wpos(q, r);
  const entry = {q, r, tile, born: performance.now(), bump: 0, quest: tile.quest, prog: 1, qdone: false};
  board.set(k, entry);
  const events = tile.special ? resolveRays([entry]) : [];
  S.tilesLeft--; S.busy = true; S.surveyBonus = 0;
  S.cur = S.nxt; S.nxt = makeTile();
  recomputeCands(); setSel(null, true); calcHold = null;
  updateAll();
  showCalc(0, 0, 0); $('#calc').classList.remove('idle');
  animFor(500); sfx.drop();
  after(170, () => { dust(wx, wy); sfx.land(); shake(2.5); buzz(8); });

  let t = 250, chipsRun = 0, multRun = 0, step = 0;
  const gap = ev.matches > 4 ? 80 : 95;
  for (let i = 0; i < 6; i++){
    if (ev.per[i] !== true) continue;
    const c = ev.edgeChips[i], ii = i, st = step++;
    after(t, () => {
      chipsRun += c; showCalc(chipsRun, multRun, null); pop('#chipsN');
      edgeFx(wx, wy, ii, c, edge(tile, ii));
      const n = board.get(key(q + DIRS[ii][0], r + DIRS[ii][1]));
      if (n){ n.bump = performance.now(); animFor(320); }
      sfx.tick(st + S.streak);
    });
    t += gap;
  }
  if (ev.chipAdd){
    after(t, () => { chipsRun += ev.chipAdd; showCalc(chipsRun, multRun, null); pop('#chipsN'); floatAt(wx, wy - 1.25, `Monoculture +${ev.chipAdd}`, 'chips', .85); sfx.tick(step + 4); });
    t += 150;
  }
  for (const e2 of events){
    const src = e2.src, [sx, sy] = wpos(src.q, src.r);
    after(t, () => { src.bump = performance.now(); animFor(320); rings.push({x: sx, y: sy, t0: performance.now(), dur: 420, c: '#ffe27a', grow: .6}); sfx.zap(); millFast(); });
    t += 120;
    for (const ray of e2.rays) for (const h of ray.hits){
      const st = step++;
      after(t, () => {
        chipsRun += h.v; showCalc(chipsRun, multRun, null); pop('#chipsN');
        const [hx, hy] = wpos(h.e.q, h.e.r);
        beams.push({x1: sx, y1: sy, x2: hx, y2: hy, t0: performance.now()});
        h.e.bump = performance.now(); animFor(320);
        floatAt(hx, hy - .5, '+' + h.v, h.v ? 'chips' : 'soft', .75, false, 700, 18);
        sfx.tick(st + S.streak);
      });
      t += 85;
    }
  }
  if (ev.matches || ev.rayChips){
    after(t, () => { multRun = ev.baseMult; showCalc(chipsRun, multRun, null); pop('#multN'); sfx.mult(0); });
    t += 130;
    ev.adds.forEach((a, j) => {
      after(t, () => { multRun += a[1]; showCalc(chipsRun, multRun, null); pop('#multN'); floatAt(wx, wy - 1.2, `${a[0]} +${a[1]}`, 'mult', .85); sfx.mult(j + 1); });
      t += 160;
    });
    ev.muls.forEach(m => {
      after(t, () => {
        multRun *= m[1]; showCalc(chipsRun, multRun, null); pop('#multN');
        if (m[0] === 'Perfect'){
          floatAt(wx, wy - .35, `Perfect ×${m[1]}`, 'mult', 1.35, true, 950);
          perfectFx(wx, wy, tile); sfx.perfect(S.streak); shake(6); punchIt(.035); buzz(25);
          entry.bump = performance.now(); animFor(320);
        } else {
          floatAt(wx, wy - .35, `Golden ×${m[1]}`, 'gold', 1.35, true, 950);
          goldFx(wx, wy); sfx.gold(); shake(4); punchIt(.02);
        }
      });
      t += 280;
    });
  }
  after(t, () => finishPlacement(entry, ev));
}
function finishPlacement(entry, ev){
  const [wx, wy] = wpos(entry.q, entry.r);
  S.roundScore += ev.total; S.total += ev.total;
  showCalc(ev.chips, ev.mult, ev.total); pop('#projN'); pop('#scoreN');
  calcHold = ev;
  if (ev.total > 0){
    floatAt(wx, wy - 1.1, '+' + fmt(ev.total), ev.perfect ? 'mult' : 'ink', 1.3, true, 1200);
    sfx.total(ev.total/goal());
    shake(Math.min(12, 1.5 + 40*ev.total/goal()));
  } else { floatAt(wx, wy - 1.1, '+0', 'soft', 1); sfx.dud(); }

  if (ev.perfect){
    S.streak++; S.perfects++; S.bestStreak = Math.max(S.bestStreak, S.streak);
    if (has('almanac')) S.almanac++;
    if (S.streak >= 2) floatAt(wx, wy - 1.8, `Streak ${S.streak}`, 'gold', .9, true, 1000);
  } else if (ev.nb > 0){
    if (S.streak >= 2) floatAt(wx, wy - 1.8, 'Streak lost', 'soft', .8);
    S.streak = 0;
  }
  for (const e of board.values()){
    if (!e.quest || e.qdone) continue;
    e.prog = regionSize(e, e.quest.t);
    if (e.prog >= e.quest.need){
      e.qdone = true; e.doneAt = performance.now(); animFor(800);
      const bonus = e.quest.need*25*(S.round + 1);
      S.tilesLeft += 2; S.roundScore += bonus; S.total += bonus; S.quests++;
      if (has('surveyor')) S.surveyBonus += 3;
      const [qx, qy] = wpos(e.q, e.r);
      questFx(qx, qy);

      sfx.quest(); buzz(20);
    }
  }
  S.harvestBase = harvestCalc().total;
  dirty = true;
  if (S.tilesLeft <= 0) after(450, startHarvest);
  else S.busy = false;
  updateAll();
}

/* ---------- harvest ---------- */
let hlRegion = null;
function startHarvest(){
  S.busy = true; harvesting = true; setSel(null, true);
  const H = harvestCalc();
  steps.length = 0; stepSpeed = 1; stepAt = performance.now();
  const ticks = H.regions.reduce((a, r) => a + r.n, 0) + H.events.reduce((a, ev) => a + ev.rays.reduce((b, r) => b + r.hits.length, 0), 0);
  const gap = Math.max(16, Math.min(80, 4800/Math.max(1, ticks)));
  let chips = 0, mult = 1, done = 0;
  const pitch = () => Math.min(22, Math.floor(done++*20/Math.max(1, ticks)));
  stepQ(900, () => {
    showBanner('Harvest', touchMode ? 'Every region scores. Tap to speed up.' : 'Every region scores. Click to speed up.');
    sfx.gong(); $('#calc').classList.remove('idle'); showCalc(0, 1, 0); updateCalc(); renderScore();
  });
  if (has('almanac') && S.almanac) stepQ(250, () => { mult += S.almanac; showCalc(chips, mult, null); pop('#multN'); sfx.mult(0); toast(`Almanac +${S.almanac} mult`); });
  const regs = [...H.regions].sort((a, b) => a.chips - b.chips || a.n - b.n);
  for (const r of regs){
    const keys = new Set(r.tiles.map(e => key(e.q, e.r)));
    stepQ(0, () => { hlRegion = {t: r.t, keys}; dirty = true; });
    for (const e of r.tiles){
      stepQ(gap, () => {
        chips += r.per; showCalc(chips, mult, null); pop('#chipsN');
        e.bump = performance.now(); animFor(320);
        const [x, y] = wpos(e.q, e.r);
        floatAt(x, y - .55, '+' + r.per, r.per ? 'chips' : 'soft', .7, false, 650, 16);
        (gap < 30 ? sfx.soft : sfx.tick)(pitch());
      });
    }
    const last = r.tiles[r.tiles.length - 1], [lx, ly] = wpos(last.q, last.r);
    if (r.mult){
      stepQ(Math.max(110, gap*2), () => {
        mult += r.mult; showCalc(chips, mult, null); pop('#multN');
        floatAt(lx, ly - 1.2, `${TER[r.t].name} ×${r.n}: +${r.mult} mult`, 'mult', .9, true, 1000);
        sfx.mult(Math.min(10, r.mult)); shake(Math.min(6, 1 + r.mult));
      });
    } else stepQ(Math.max(30, gap), () => {});
  }
  stepQ(0, () => { hlRegion = null; dirty = true; });
  for (const ev of H.events){
    const src = ev.src, [sx, sy] = wpos(src.q, src.r);
    stepQ(Math.max(100, gap*2), () => { src.bump = performance.now(); animFor(320); rings.push({x: sx, y: sy, t0: performance.now(), dur: 420, c: '#ffe27a', grow: .6}); sfx.zap(); millFast(); });
    for (const ray of ev.rays) for (const h of ray.hits){
      stepQ(Math.max(30, gap*1.2), () => {
        chips += h.v; showCalc(chips, mult, null); pop('#chipsN');
        const [hx, hy] = wpos(h.e.q, h.e.r);
        beams.push({x1: sx, y1: sy, x2: hx, y2: hy, t0: performance.now()});
        h.e.bump = performance.now(); animFor(320);
        floatAt(hx, hy - .55, '+' + h.v, h.v ? 'chips' : 'soft', .7, false, 650, 16);
        sfx.tick(pitch());
      });
    }
    if (ev.rays.length){
      stepQ(160, () => {
        const add = rayMultPer();
        mult += add; showCalc(chips, mult, null); pop('#multN');
        floatAt(sx, sy - 1.3, `${SPECIALS[src.tile.special].name} +${add} mult`, 'mult', .9, true, 1000);
        sfx.mult(6); shake(3);
      });
    }
  }
  stepQ(700, () => {
    const total = Math.round(chips*mult);
    S.roundScore += total; S.total += total; S.bestHarvest = Math.max(S.bestHarvest, total);
    showCalc(chips, mult, total); pop('#projN'); pop('#scoreN');
    floatAt(cam.x, cam.y - .5, `Harvest +${fmt(total)}`, 'ink', 2, true, 1800, 20);
    clearFx(.5); sfx.big(total/goal()); shake(Math.min(16, 5 + 10*total/goal())); punchIt(.05); buzz(50);
  });
  stepQ(1300, () => {
    harvesting = false; stepSpeed = 1;
    if (S.roundScore >= goal()){
      clearFx(1); sfx.clear(); shake(8);
      showBanner('Goal reached', `${fmt(S.roundScore)} of ${fmt(goal())}`);
      after(1400, endRound);
    } else {
      sfx.fail(); shake(10); buzz(60);
      showBanner('The harvest came up short', `${fmt(S.roundScore)} of ${fmt(goal())}`, true);
      after(1600, gameOver);
    }
    updateAll();
  });
}

function rotate(dir){

}

function tileHint(t){

function updateCalc(){

  if (!curEval){

  const arr = [...cands.values()].sort((a,b) => (a.r - b.r) || ((a.q + a.r/2) - (b.q + b.r/2)));
  if (!arr.length) return;
  const idx = sel ? arr.findIndex(c => c.k === sel.k) : (dir > 0 ? -1 : 0);
  setSel(arr[(idx + dir + arr.length) % arr.length], false, true);
}
addEventListener('keydown', e => {
  if (overlayOpen() || !S) return;
  if (harvesting){ speedUp(); return; }
  const k = e.key.toLowerCase();
  if (k === 'r' || k === 'e') rotate(1);
  else if (k === 'q') rotate(-1);
  else if (k === 'x') redraw();
  else if (k === 'm') toggleMute();
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); cycle(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ e.preventDefault(); cycle(-1); }
  else if (k === 'enter'){ if (document.activeElement && document.activeElement.tagName === 'BUTTON') return; place(); }
});
$('#rotBtn').addEventListener('click', () => rotate(1));
$('#curBtn').addEventListener('click', () => rotate(1));
$('#redrawBtn').addEventListener('click', redraw);
$('#placeBtn').addEventListener('click', place);
$('#helpBtn').addEventListener('click', showIntro);
$('#muteBtn').addEventListener('click', toggleMute);
$('#relics').addEventListener('click', e => {
  const b = e.target.closest('.relic'); if (!b) return;
  toast(b.dataset.boss ? BMAP[b.dataset.boss].desc : RMAP[b.dataset.id].desc);
});
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function renderMute(){ const b = $('#muteBtn'); b.innerHTML = muted ? ICON_OFF : ICON_ON; b.setAttribute('aria-pressed', String(!muted)); b.setAttribute('aria-label', muted ? 'Sound off' : 'Sound on'); }
function toggleMute(){
  muted = !muted;
  try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (e) {}
  if (muted && AC) AC.suspend(); else { ac(); sfx.select(); }
  renderMute(); toast(muted ? 'Sound off' : 'Sound on');
}

/* ---------- overlays ---------- */
const ov = $('#overlay');
function openOverlay(html){ ov.innerHTML = html; ov.hidden = false; const b = ov.querySelector('button'); if (b) b.focus({preventScroll: true}); }
function closeOverlay(){ ov.hidden = true; ov.innerHTML = ''; }
function getBest(){ try { return +localStorage.getItem(BEST_KEY) || 0; } catch (e) { return 0; } }
function saveBest(n){ try { if (n > getBest()) localStorage.setItem(BEST_KEY, String(n)); } catch (e) {} }
function drawCluster(canvas, list){
  const {g, w, h} = sizeCanvas(canvas);
  const v = fitView(list, w, h, 4, 60), sc = v.size/S0;
  list.map(p => { const [x, y] = wpos(p.q, p.r); return {x: w/2 + v.size*(x - v.x), y: h/2 + v.size*(y - v.y), tile: p.tile}; })
    .sort((a,b) => a.y - b.y)
    .forEach(it => {
      g.drawImage(getSprite(it.tile), it.x - SD.cx*sc, it.y - SD.cy*sc, SD.w*sc, SD.h*sc);
      if (it.tile.special === 'windmill') drawSails(g, it.x, it.y - HUB*v.size, .4*v.size, .5);
    });
}
let HERO = null;
function heroCluster(){
  const c = makeTile(3, true), list = [{q:0, r:0, tile:c}];
  DIRS.forEach(([dq,dr], i) => { const t = makeTile(0, true); t.base[(i+3) % 6] = edge(c, i); list.push({q:dq, r:dr, tile:t}); });
  c.special = 'windmill'; list[2].tile.gold = true; list[5].tile.special = 'lighthouse';
  return list;
}
function statsHtml(){
  return `<div class="stats"><div><b>${fmt(S.bestHarvest)}</b><small>Best harvest</small></div><div><b>${S.perfects}</b><small>Perfects</small></div><div><b>${S.bestStreak}</b><small>Best streak</small></div><div><b>${S.quests}</b><small>Quests</small></div></div>`;
}
function showIntro(){
  if (!HERO) HERO = heroCluster();
  const best = getBest();
  const legend = Object.entries(TER).sort((a,b) => b[1].chips - a[1].chips)
    .map(([,t]) => `<span><i style="background:${t.top}"></i>${t.name} <b>${t.chips}</b></span>`).join('');
  openOverlay(`<div class="sheet">
    <h1>Patchland</h1>
    <canvas class="hero" id="heroCv"></canvas>
    <p>Lay hex tiles to grow a patch of countryside. Every edge that matches the land beside it adds its chips and +1 mult, and matching every neighbor doubles the mult.</p>
    <p>When your tiles run out, the harvest scores every region of linked land on the whole board, and bigger regions add more mult. Your placements plus the harvest must reach the goal.</p>
    <p>Windmills, lighthouses and bell towers fire rays that score every tile they hit, and a ray that hits another special tile sets it off too. Golden tiles, quest flags, perfect streaks and boss rounds (3, 6 and 8) add extra twists.</p>
    <div class="legend">${legend}</div>
    <p class="muted">Rotate with the button, by tapping your tile, with R, or with the scroll wheel. Redraw swaps your tile for the next one.</p>
    ${best ? `<p class="muted">Best run: ${fmt(best)} points</p>` : ''}
    <button class="btn primary go" data-act="close">${started ? 'Back to the board' : 'Start run'}</button>
  </div>`);
  drawCluster($('#heroCv'), HERO);
}
function endRound(){
  saveBest(S.total);
  if (S.round === ROUNDS - 1) return win();
  S.picks = S.boss ? 2 : 1;
  showDraft(true);
}
function showDraft(first){
  const pool = shuffle(RELICS.filter(r => !has(r.id))).slice(0, 3);
  if (!pool.length){ closeOverlay(); S.round++; startRound(); return; }
  const title = !first ? 'One more relic' : S.boss ? `${BMAP[S.boss].name} beaten` : `Round ${S.round + 1} cleared`;
  const body = !first ? 'Pick your second relic.'
    : `You scored ${fmt(S.roundScore)} against a goal of ${fmt(goal())}. ` + (S.boss ? 'Boss rounds pay double, so you get two relics. Pick the first.' : 'Pick a relic to keep for the rest of the run.');
  openOverlay(`<div class="sheet">
    <h2>${title}</h2>
    <p>${body}</p>
    <div class="cards">${pool.map(r => `<button class="card" data-relic="${r.id}"><canvas data-t="${r.t}" data-id="${r.id}"></canvas><span><b>${r.name}</b><small>${r.desc}</small></span></button>`).join('')}</div>
  </div>`);
  ov.querySelectorAll('canvas[data-t]').forEach(c => {
    drawTileIn(c, {id: 'relic-' + c.dataset.id, base: Array(6).fill(c.dataset.t), rot: 0, seed: hashStr(c.dataset.id), gold: false, quest: null, special: null});
  });
}
function gameOver(){
  saveBest(S.total);
  openOverlay(`<div class="sheet">
    <h2>The harvest came up short</h2>
    <p>Round ${S.round + 1} ended at ${fmt(S.roundScore)} of ${fmt(goal())}. Your run scored ${fmt(S.total)} points in total.</p>
    ${statsHtml()}
    <p class="muted">Best run: ${fmt(getBest())} points</p>
    <button class="btn primary go" data-act="new">New run</button>
  </div>`);
}
function win(){
  saveBest(S.total);
  openOverlay(`<div class="sheet">
    <h2>All 8 rounds cleared</h2>
    <p>Your countryside held up. The run scored ${fmt(S.total)} points with ${S.relics.length} relics.</p>
    ${statsHtml()}
    <p class="muted">Best run: ${fmt(getBest())} points</p>
    <button class="btn primary go" data-act="new">New run</button>
  </div>`);
}
ov.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.act === 'close'){
    const first = !started; started = true; closeOverlay();
    if (first) roundBanner();
  } else if (b.dataset.act === 'new'){ closeOverlay(); newRun(); roundBanner(); }
  else if (b.dataset.relic){
    S.relics.push(b.dataset.relic); sfx.pick(); buzz(10);
    S.picks--;
    if (S.picks > 0) showDraft(false);
    else { closeOverlay(); toast(RMAP[b.dataset.relic].name + ' added'); S.round++; startRound(); }
  }
});

/* ---------- boot ---------- */
readColors();
renderMute();
newRun();
requestAnimationFrame(t => { resize(); last = t; requestAnimationFrame(frame); showIntro(); });
if (document.fonts) document.fonts.ready.then(() => { dirty = true; });
})();
</script>
</body>
</html>
